name: Apple Style Guide & Grammar Checker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-apple-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Apple Style Guide Validation Script
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          // Apple product and platform names that must use their official capitalization.
          const incorrectPatterns = [
            { regex: /\biphone\b/g, correct: "iPhone" },
            { regex: /\bipad\b/g, correct: "iPad" },
            { regex: /\bmacbook\b/g, correct: "MacBook" },
            { regex: /\bapp store\b/gi, correct: "App Store" },
            { regex: /\bios\b/g, correct: "iOS" },
            { regex: /\bmacos\b/g, correct: "macOS" }
          ];

          function walkDir(dir) {
            let results = [];
            for (const file of fs.readdirSync(dir)) {
              const filePath = path.join(dir, file);
              const stat = fs.statSync(filePath);
              if (stat.isDirectory()) {
                if (!filePath.includes("node_modules") && !filePath.includes(".git")) {
                  results = results.concat(walkDir(filePath));
                }
              } else if (filePath.endsWith(".md")) {
                results.push(filePath);
              }
            }
            return results;
          }

          const mdFiles = walkDir(".");
          let hasError = false;

          for (const file of mdFiles) {
            const content = fs.readFileSync(file, "utf8");
            for (const pattern of incorrectPatterns) {
              pattern.regex.lastIndex = 0;
              if (pattern.regex.test(content)) {
                console.error(`[Apple Style Error] ${file}: use "${pattern.correct}" for the Apple product/platform name.`);
                hasError = true;
              }
            }
          }

          if (hasError) {
            console.error("\nApple Style Guide validation failed.");
            process.exit(1);
          }

          console.log("Documentation passed Apple Style Guide validation.");
          NODE
