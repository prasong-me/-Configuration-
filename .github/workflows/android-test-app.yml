name: Android Test App

on:
  push:
    branches: ["main", "test/android12-webview-app"]
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - ".github/workflows/android-test-app.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - ".github/workflows/android-test-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build Web App source
        run: npm install && npm --prefix apps/web run build
      - name: Bundle Web App into Android assets
        run: rm -rf apps/android/app/src/main/assets/web && mkdir -p apps/android/app/src/main/assets/web && cp -R apps/web/dist/. apps/android/app/src/main/assets/web/
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build Android debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: network-configuration-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
