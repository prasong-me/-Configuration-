name: Android Test App

on:
  push:
    branches: ["main", "test/android12-webview-app"]
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - ".github/workflows/android-test-app.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - ".github/workflows/android-test-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"
      - name: Build Android debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: network-configuration-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
