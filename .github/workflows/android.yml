name: Android App

on:
  push:
    branches: [main, feat/android-app-v1]
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-31" "platforms;android-35" "build-tools;35.0.0"
      - name: Build web bundle
        run: npm --prefix apps/web install && npm --prefix apps/web run build
      - name: Package web assets
        run: rm -rf apps/android/app/src/main/assets/web && mkdir -p apps/android/app/src/main/assets/web && cp -R apps/web/dist/. apps/android/app/src/main/assets/web/
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: configuration-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  runtime-api31:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: configuration-android-debug
          path: artifacts
      - name: Run API 31 emulator
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 1536M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -no-metrics
          script: |
            set -e
            adb shell getprop ro.build.version.sdk | grep -Fx "31"
            adb logcat -c
            adb install -r artifacts/app-debug.apk
            adb shell am force-stop com.prasongme.configuration
            adb shell am start -n com.prasongme.configuration/.MainActivity

            ready=0
            for i in $(seq 1 15); do
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              if adb shell cat /sdcard/window.xml | grep -F "Configuration Platform" >/dev/null 2>&1 && adb shell cat /sdcard/window.xml | grep -vF "Webpage not available" >/dev/null 2>&1 && adb shell cat /sdcard/window.xml | grep -vF "ERR_INVALID_RESPONSE" >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done

            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb shell dumpsys activity top > activity-top.txt
            adb shell dumpsys webviewupdate > webview-update.txt

            echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')" > api31-runtime-evidence.txt
            echo "package_pid=$(adb shell pidof com.prasongme.configuration | tr -d '\r')" >> api31-runtime-evidence.txt
            echo "activity=" >> api31-runtime-evidence.txt
            cat activity-top.txt >> api31-runtime-evidence.txt
            echo "webview=" >> api31-runtime-evidence.txt
            cat webview-update.txt >> api31-runtime-evidence.txt
            echo "ui_webview=" >> api31-runtime-evidence.txt
            adb shell cat /sdcard/window.xml >> api31-runtime-evidence.txt
            echo "logcat=" >> api31-runtime-evidence.txt
            adb shell logcat -d -t 800 >> api31-runtime-evidence.txt
            adb shell cat /sdcard/window.xml > ui.xml

            test "$ready" -eq 1
            adb shell pidof com.prasongme.configuration
            grep -F "ACTIVITY com.prasongme.configuration/.MainActivity" activity-top.txt
            adb shell cat /sdcard/window.xml | grep -F "android.webkit.WebView"
            adb shell cat /sdcard/window.xml | grep -F "Configuration Platform"
            adb shell cat /sdcard/window.xml | grep -F 'resource-id="root"'
            adb shell cat /sdcard/window.xml | grep -vF "Webpage not available"
            adb shell cat /sdcard/window.xml | grep -vF "ERR_INVALID_RESPONSE"
      - name: Upload API 31 runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: api31-runtime-evidence
          if-no-files-found: error
          path: |
            api31-runtime-evidence.txt
            ui.xml
