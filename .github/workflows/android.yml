name: Android App

on:
  push:
    branches: [main, feat/android-app-v1]
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-31" "platforms;android-35" "build-tools;35.0.0"
      - name: Build web bundle
        run: npm --prefix apps/web install && npm --prefix apps/web run build
      - name: Package web assets
        run: rm -rf apps/android/app/src/main/assets/web && mkdir -p apps/android/app/src/main/assets/web && cp -R apps/web/dist/. apps/android/app/src/main/assets/web/
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: configuration-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  runtime-api31:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android API 31 emulator
        run: |
          sdkmanager "platforms;android-31" "build-tools;35.0.0" "emulator" "platform-tools" "system-images;android-31;google_apis;x86_64"
          yes | sdkmanager --licenses >/dev/null || true
          echo "no" | avdmanager create avd -n api31 -k "system-images;android-31;google_apis;x86_64" --force
          emulator -list-avds

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: configuration-android-debug
          path: artifacts

      - name: Start API 31 emulator
        run: |
          nohup emulator -avd api31 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "^1$"; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install and launch APK
        run: |
          adb install -r artifacts/app-debug.apk
          adb shell am force-stop com.prasongme.configuration
          adb shell am start -n com.prasongme.configuration/.MainActivity
          sleep 8
          adb shell pidof com.prasongme.configuration
          adb shell dumpsys activity top | grep -F "com.prasongme.configuration/.MainActivity"

      - name: Verify WebView UI is rendered
        run: |
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb shell cat /sdcard/window.xml > ui.xml
          grep -E "Configuration Platform|Search|Configuration Compiler" ui.xml

      - name: Capture runtime evidence
        if: always()
        run: |
          adb shell getprop ro.build.version.sdk || true
          adb shell dumpsys activity top || true
          adb shell pidof com.prasongme.configuration || true
          adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          adb shell cat /sdcard/window.xml || true
          cat emulator.log || true
