name: Android App

on:
  push:
    branches: [main, feat/android-app-v1]
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-31" "platforms;android-35" "build-tools;35.0.0"
      - name: Build web bundle
        run: npm --prefix apps/web install && npm --prefix apps/web run build
      - name: Package web assets
        run: rm -rf apps/android/app/src/main/assets/web && mkdir -p apps/android/app/src/main/assets/web && cp -R apps/web/dist/. apps/android/app/src/main/assets/web/
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: configuration-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
