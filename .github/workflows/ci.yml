name: CI
on:
  push:
    branches: ["main", "feature/app-export-endpoint"]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:export:routing-rules
      - run: npm run test:export:vpn
      - run: npm run test:export:apple
      - run: npm run test:export:dns
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/web install
      - run: npm --prefix apps/web run build
