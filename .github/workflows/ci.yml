name: CI
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/web install
      - run: npm --prefix apps/web run build
  mobileconfig:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:mobileconfig
      - name: Validate signed MobileConfig tooling
        run: npm test -- --test-name-pattern="Apple certificate/signing is required only for explicit managed deployment"
